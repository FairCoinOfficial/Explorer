    <link rel="canonical" href="https://explorer.fairco.in/" />

    <meta name="application-name" content="FairCoin Explorer" />
    <meta name="apple-itunes-app" content="app-argument=https://explorer.fairco.in/" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <link rel="icon" type="image/jpeg" href="/images/FairCoin-Logo.jpg" />
    <link rel="shortcut icon" href="/images/FairCoin-Logo.jpg" />

    <!-- Match Bloom's persisted mode before the first paint. -->
    <script>
      (function () {
        var mode = 'dark';
        try {
          var saved = JSON.parse(localStorage.getItem('faircoin-bloom-theme') || 'null');
          mode = (saved && saved.mode) || mode;
        } catch (_) {}
        var dark = mode === 'dark' || (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
      })();
    </script>

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
